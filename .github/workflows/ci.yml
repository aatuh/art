name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install project Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - name: Install pinned wasm-pack
        run: cargo +stable install wasm-pack --version 0.15.0 --locked
      - name: Run repository quality gate
        run: |
          rustup default 1.85.0
          make check
      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools
      - name: Validate planetary shaders
        run: sh scripts/check_planet_shaders.sh
