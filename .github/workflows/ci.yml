name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.85.0
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Run repository quality gate
        run: make check
