[package]
name = "black-cube-gallery"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A static WebAssembly digital art gallery."
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.84"
wasm-bindgen = "=0.2.107"
web-sys = { version = "=0.3.84", features = [
  "console",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MouseEvent",
  "Node",
  "Performance",
  "Storage",
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlProgram",
  "WebGlRenderingContext",
  "WebGlShader",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "Window"
] }
